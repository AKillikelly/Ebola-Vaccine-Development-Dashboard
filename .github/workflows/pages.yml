name: Automated refresh and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 06:17 America/Montreal time.
    # Minute 17 avoids the top-of-hour congestion window.
    - cron: "17 6 * * 1"
      timezone: "America/Montreal"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and derive Ebola vaccine pipeline data
        run: python scripts/fetch_pipeline.py

      - name: Build static dashboard
        run: python scripts/build_dashboard.py

      - name: Optionally commit generated data snapshot
        if: ${{ vars.COMMIT_GENERATED_DATA == 'true' && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pipeline.csv data/raw reports/automation_summary.md public/ebola_vaccine_development_pipeline_data.csv public/automation_summary.md
          git diff --cached --quiet || git commit -m "Automated Ebola vaccine pipeline refresh [skip ci]"
          git push || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
